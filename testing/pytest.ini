[pytest]
asyncio_mode = auto
addopts = -ra -v
markers =
    auth: Authentication test cases (AUTH-*)
    rbac: Role-based access control test cases (RBAC-*)
    upl: File upload test cases (UPL-*)
    data: Data integrity / disclosure test cases (DATA-*)
    api: API hardening test cases (API-*)
    slow: Requires the ML model to be loaded (inference) — slow, opt-in via RUN_MODEL=1
    destructive: Mutates/deletes real data — opt-in via RUN_DESTRUCTIVE=1
